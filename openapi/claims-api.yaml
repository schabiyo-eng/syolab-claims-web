openapi: 3.0.3
info:
  title: Syolab Claims API
  version: 1.0.0
  description: Claims intake API for the Syolab insurance demo. Money amounts are decimal strings.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /api/auth/login:
    post:
      operationId: login
      summary: Sign in and receive a bearer token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Username or password is incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /api/auth/me:
    get:
      operationId: currentUser
      summary: Get the signed-in user
      responses:
        "200":
          description: The user the bearer token belongs to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/policies:
    get:
      operationId: listPolicies
      summary: List policies
      description: Results are scoped to the caller. Claimants see only their own policies. Adjusters see every policy.
      responses:
        "200":
          description: Policies in stable policy-number order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Policy"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/policies/{policyNumber}:
    get:
      operationId: getPolicy
      summary: Get one policy
      description: Scoped to the caller. Claimants can read only their own policies. Adjusters can read any policy. A policy outside the caller's scope returns 404, the same as a missing one.
      parameters:
        - $ref: "#/components/parameters/PolicyNumber"
      responses:
        "200":
          description: The policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/claims:
    get:
      operationId: listClaims
      summary: List claims newest first
      description: Results are scoped to the caller. Claimants see only claims on their own policies. Adjusters see every claim.
      responses:
        "200":
          description: Claims ordered by createdAt descending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Claim"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createClaim
      summary: Submit a claim and run validation
      description: A claimant can file only on their own policies. A claim on any other policy returns 404 and is not stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClaimRequest"
      responses:
        "201":
          description: Claim stored, including rejected and flagged claims
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/claims/{id}:
    get:
      operationId: getClaim
      summary: Get one claim
      description: Scoped to the caller. Claimants can read only claims on their own policies. Adjusters can read any claim. A claim outside the caller's scope returns 404, the same as a missing one.
      parameters:
        - $ref: "#/components/parameters/ClaimId"
      responses:
        "200":
          description: The claim with its decision history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/claims/{id}/decision:
    post:
      operationId: decideClaim
      summary: Record an adjuster decision on a claim
      description: >-
        Adjusters only. A claimant gets 403 before the claim or body is checked.
        A note is required for DENIED and INFO_REQUESTED and optional for APPROVED.
        APPROVED and DENIED are final, so a later decision returns 409.
        INFO_REQUESTED is not final and can move to APPROVED, DENIED, or INFO_REQUESTED again.
      parameters:
        - $ref: "#/components/parameters/ClaimId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequest"
      responses:
        "200":
          description: The updated claim with a new DECIDED history entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/claims/{id}/comments:
    get:
      operationId: listComments
      summary: List comments on a claim oldest first
      description: Scoped to the caller. Claimants can read comments only on claims on their own policies. Adjusters can read comments on any claim. A claim outside the caller's scope returns 404, the same as a missing one.
      parameters:
        - $ref: "#/components/parameters/ClaimId"
      responses:
        "200":
          description: Comments ordered by at ascending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: addComment
      summary: Add a comment to a claim
      description: Scoped to the caller. Claimants can comment only on claims on their own policies. Adjusters can comment on any claim. A claim outside the caller's scope returns 404, the same as a missing one. The author and role come from the bearer token.
      parameters:
        - $ref: "#/components/parameters/ClaimId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentRequest"
      responses:
        "201":
          description: Comment stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    PolicyNumber:
      name: policyNumber
      in: path
      required: true
      schema:
        type: string
    ClaimId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
    Unauthorized:
      description: Missing, unknown, or expired bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
    Forbidden:
      description: The caller's role may not perform this action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
    Conflict:
      description: The request conflicts with the resource's current state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
  schemas:
    Role:
      type: string
      enum: [CLAIMANT, ADJUSTER]
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          example: amira.shah
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      additionalProperties: false
      required: [token, username, role, displayName]
      properties:
        token:
          type: string
          description: Bearer token for the Authorization header
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        displayName:
          type: string
    CurrentUser:
      type: object
      additionalProperties: false
      required: [username, role, displayName]
      properties:
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        displayName:
          type: string
    Policy:
      type: object
      additionalProperties: false
      required:
        - policyNumber
        - holderName
        - status
        - coverageLimit
        - effectiveDate
        - expirationDate
        - requiredDocuments
      properties:
        policyNumber:
          type: string
          example: POL-1001
        holderName:
          type: string
        status:
          type: string
          enum: [ACTIVE, EXPIRED, CANCELLED]
        coverageLimit:
          type: string
          description: Decimal dollars with two fraction digits, such as 10000.00
          example: "10000.00"
        effectiveDate:
          type: string
          format: date
        expirationDate:
          type: string
          format: date
        requiredDocuments:
          type: array
          items:
            type: string
    CreateClaimRequest:
      type: object
      additionalProperties: false
      required:
        - policyNumber
        - claimantName
        - amount
        - incidentDate
        - description
        - documentNames
      properties:
        policyNumber:
          type: string
        claimantName:
          type: string
        amount:
          type: string
          description: Decimal dollars. More than two fraction digits is a 400.
          example: "250.00"
        incidentDate:
          type: string
          format: date
        description:
          type: string
        documentNames:
          type: array
          items:
            type: string
    Claim:
      type: object
      description: ClaimDetail extends this schema with history, so it allows extra properties.
      required:
        - id
        - policyNumber
        - claimantName
        - amount
        - incidentDate
        - description
        - documentNames
        - status
        - findings
        - decision
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        policyNumber:
          type: string
        claimantName:
          type: string
        amount:
          type: string
        incidentDate:
          type: string
          format: date
        description:
          type: string
        documentNames:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [ACCEPTED, FLAGGED, REJECTED]
        findings:
          type: array
          items:
            $ref: "#/components/schemas/ValidationFinding"
        decision:
          $ref: "#/components/schemas/Decision"
        createdAt:
          type: string
          format: date-time
    Decision:
      type: string
      description: The adjuster decision, separate from the validation status. APPROVED and DENIED are final.
      enum: [PENDING, APPROVED, DENIED, INFO_REQUESTED]
    DecisionChoice:
      type: string
      description: A decision an adjuster can record. PENDING is only the starting state.
      enum: [APPROVED, DENIED, INFO_REQUESTED]
    DecisionRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          $ref: "#/components/schemas/DecisionChoice"
        note:
          type: string
          description: Required and non-blank for DENIED and INFO_REQUESTED. Optional for APPROVED.
    HistoryEntry:
      type: object
      additionalProperties: false
      required: [at, actor, action, fromDecision, toDecision, note]
      properties:
        at:
          type: string
          format: date-time
        actor:
          type: string
          description: Display name of the user who acted
        action:
          type: string
          enum: [SUBMITTED, DECIDED]
        fromDecision:
          allOf:
            - $ref: "#/components/schemas/Decision"
          nullable: true
          description: Null for SUBMITTED
        toDecision:
          $ref: "#/components/schemas/Decision"
        note:
          type: string
          nullable: true
    ClaimDetail:
      allOf:
        - $ref: "#/components/schemas/Claim"
        - type: object
          required: [history]
          properties:
            history:
              type: array
              description: Ordered oldest first
              items:
                $ref: "#/components/schemas/HistoryEntry"
    Comment:
      type: object
      additionalProperties: false
      required: [id, at, author, role, body]
      properties:
        id:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
        author:
          type: string
          description: Display name of the user who wrote the comment
        role:
          $ref: "#/components/schemas/Role"
        body:
          type: string
    CommentRequest:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
          description: Non-blank after trimming, at most 2000 characters
    ValidationFinding:
      type: object
      additionalProperties: false
      required: [code, severity, message]
      properties:
        code:
          type: string
          enum:
            - POLICY_NOT_FOUND
            - POLICY_INACTIVE
            - EXCEEDS_COVERAGE
            - MISSING_DOCUMENTS
            - POSSIBLE_FRAUD
        severity:
          type: string
          enum: [ERROR, WARNING]
        message:
          type: string
    ErrorMessage:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
